<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f5f1">
  <meta name="description" content="The personal website of Tomas Nelson.">
  <title>Tomas Nelson</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f6f5f1;
      --ink: #20231f;
      --muted: #73776f;
      --accent: #52745c;
      --line: #dedfd8;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      width: min(100% - 48px, 1040px);
      min-height: 100vh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }

    header {
      min-height: 88px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--line);
    }

    .wordmark {
      color: var(--ink);
      font-size: 15px;
      font-weight: 650;
      letter-spacing: -0.02em;
      text-decoration: none;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 88px 0 120px;
    }

    .intro { max-width: 720px; }

    .eyebrow {
      margin: 0 0 24px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 650;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 680px;
      margin: 0;
      font-size: clamp(52px, 10vw, 104px);
      font-weight: 540;
      letter-spacing: -0.075em;
      line-height: 0.98;
    }

    .description {
      max-width: 460px;
      margin: 32px 0 0;
      color: var(--muted);
      font-size: clamp(17px, 2.2vw, 20px);
      line-height: 1.65;
    }

    footer {
      min-height: 76px;
      display: flex;
      align-items: center;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 560px) {
      .page { width: min(100% - 36px, 1040px); }
      header { min-height: 72px; }
      main { padding: 64px 0 88px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a class="wordmark" href="./">Tomas Nelson</a>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">Personal website</p>
        <h1 id="page-title">A fresh start.</h1>
        <p class="description">I'm rebuilding this space. Check back soon to see what's next.</p>
      </section>
    </main>

    <footer>© <span id="year">2026</span> Tomas Nelson</footer>
  </div>
</body>
</html>
